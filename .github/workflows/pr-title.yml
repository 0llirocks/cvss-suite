# Releasing runs off the squashed pull request title, and release-please skips
# any subject it cannot parse. An unprefixed title therefore ships nothing, with
# nothing failing to say so. This check is that missing signal.
name: PR title

# pull_request_target, not pull_request: runs on fork pull requests are held for
# maintainer approval, and forks are the case that matters. Safe because this job
# never checks out the head branch -- it only reads the title off the payload.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    # Dependabot is exempt on purpose: its unparseable subjects are what keep a
    # weekly dependency bump from cutting a release. See .github/dependabot.yml.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest

    steps:
      # Pinned by digest rather than tag, unlike the first-party actions
      # elsewhere here: this one is a single maintainer's, and it runs in
      # base-repo context. Dependabot keeps the pin current.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
